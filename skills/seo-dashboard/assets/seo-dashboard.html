function themeBars(parent){

function statusFill(key){return {candidate:['var(--neutral-mark)',.75],proposed:['var(--accent)',.5],approved:['var(--accent)',.7],briefed:['var(--accent)',.85],published:['var(--accent)',1],dropped:['var(--neutral-mark)',.3]}[key]||['var(--neutral-mark)',.5];}

function unitGrid(parent,rows,label,minHeight=0){

 rows.forEach((r,i)=>{const x=3+(i%columns)*(size+gap),y=3+Math.floor(i/columns)*(size+gap),mark=svgEl('rect',{x,y,width:size,height:size,class:'unit-square',fill:r.kind==='own'?'var(--accent)':r.kind==='filled'?'var(--neutral-mark)':'var(--surface)',stroke:r.kind==='own'?'var(--accent)':'var(--neutral-mark)',...(r.kind==='unknown'?{'stroke-dasharray':'3 2'}:{})});svg.append(mark);const hit=svgEl('rect',{x:x-1.5,y:y-1.5,width:size+3,height:size+3,fill:'transparent',class:'unit-hit'});bindMark(hit,tip,host,[r.label,r.state],x,y+size+5);svg.append(hit);});

}
function unitLegend(parent,items){const legend=el('div',null,'unit-legend');items.forEach(([kind,text])=>{const item=el('span',null,'unit-key'),mark=el('i',null,kind);mark.setAttribute('aria-hidden','true');item.append(mark,document.createTextNode(text));legend.append(item);});parent.append(legend);}
function aiUnits(parent,large=false){

function citationBars(parent,limit){

function aggregateWeeks(daily){
 const sorted=[...daily].sort((a,b)=>a.date.localeCompare(b.date)),weeks=new Map();
 sorted.forEach(r=>{const d=new Date(r.date+'T00:00:00Z'),offset=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-offset);const key=d.toISOString().slice(0,10);if(!weeks.has(key))weeks.set(key,{date:key,end:new Date(d.getTime()+6*86400000).toISOString().slice(0,10),clicks:0,impressions:0,days:0});const week=weeks.get(key);week.clicks+=r.clicks;week.impressions+=r.impressions;week.days++;});return [...weeks.values()];
}
function monthDay(value){const d=new Date(value+'T00:00:00Z');return `${d.getUTCMonth()+1}月${d.getUTCDate()}日`;}
function timePlot(parent,daily,grain){
 const sorted=[...daily].sort((a,b)=>a.date.localeCompare(b.date));if(!sorted.length){empty(parent,'日別の実績はまだありません。');return;}
 const rows=grain==='week'?aggregateWeeks(sorted):sorted;const {wrap,host}=chartHost(parent),readout=el('p','グラフに合わせるか、フォーカスして左右キーで値を確認できます。','chart-help');readout.id='time-readout-'+(++chartId);readout.setAttribute('role','status');wrap.append(readout);

 [['impressions','表示回数','var(--series-1)',T],['clicks','クリック','var(--series-2)',T+h+gap]].forEach(([key,label,color,top])=>{const axis=niceAxis(Math.max(0,...rows.map(r=>r[key]))),y=v=>top+h-v/axis.max*h;svg.append(svgEl('text',{x:L,y:top-15,class:'axis-title'},label));
 for(let v=0;v<=axis.max;v+=axis.step){svg.append(svgEl('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'grid'}),svgEl('text',{x:L-8,y:y(v)+4,'text-anchor':'end'},number(v)));}
 if(grain==='week')rows.forEach(r=>{const width=Math.max(1,Math.min(16,slot-2));if(r[key]>0)svg.append(svgEl('rect',{x:x(r)-width/2,y:y(r[key]),width,height:Math.max(0,h*r[key]/axis.max),rx:Math.min(4,h*r[key]/axis.max/2),fill:color}));});
 else{svg.append(svgEl('path',{d:rows.map((r,i)=>(i?'L':'M')+x(r)+','+y(r[key])).join(' '),fill:'none',stroke:color,'stroke-width':2}));if(rows.length===1)svg.append(svgEl('circle',{cx:x(rows[0]),cy:y(rows[0][key]),r:3,fill:color}));}

 const marker=svgEl('line',{x1:L,x2:L,y1:T,y2:H-B,class:'crosshair',visibility:'hidden'});svg.append(marker);const hit=svgEl('rect',{x:L,y:T,width:plotW,height:H-T-B,class:'hit',tabindex:0,role:'slider','aria-label':grain==='week'?'週を選択':'日を選択','aria-orientation':'horizontal','aria-valuemin':1,'aria-valuemax':rows.length,'aria-valuenow':1,'aria-describedby':readout.id});svg.append(hit);let current=0;

 const show=i=>{current=Math.max(0,Math.min(rows.length-1,i));const r=rows[current],px=x(r),text=describe(r);tip.replaceChildren(el('strong',grain==='week'?`${monthDay(r.date)}〜${monthDay(r.end)}`:dateText(r.date)),el('div',`表示回数 ${number(r.impressions)}`),el('div',`クリック ${number(r.clicks)}`));if(grain==='week'&&r.days<7)tip.append(el('div',`記録のある ${r.days} 日分`));marker.setAttribute('x1',px);marker.setAttribute('x2',px);marker.setAttribute('visibility','visible');hit.setAttribute('aria-valuenow',current+1);hit.setAttribute('aria-valuetext',text);readout.textContent=text;placeTip(tip,host,px,T+8);};

 });
}

function localTimestamp(value){const d=new Date(value);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
async function start(){try{
 let response;try{response=await fetch('./seo-dashboard.data.json');}catch(error){throw new Error(`データを読み込めません（${error.message}）。HTML と同じ場所に seo-dashboard.data.json を置いてください。`);}if(!response.ok)throw new Error(`データを読み込めません（HTTP ${response.status}）。seo-dashboard.data.json の配置を確認してください。`);

start();
